name: CI

on:
  pull_request:
  push:
    branches: [main]
  # By ticket-push.yml, for a push to a ticket branch that has no pull request open yet.
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # The same major version as the live database, so the real-Postgres tests mean something.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          # Made as the live database is: text sorted by code point (the builtin C.UTF-8), not by the image's en_US.
          # The container keeps UTC. scripts/local-db.postgres.test.ts checks both, here and against db:start's.
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the migrations check compares against the base branch

      - uses: pnpm/action-setup@v6 # the pnpm version comes from package.json's packageManager
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json # devEngines.runtime: the Node.js pnpm runs every script on, and the Vercel project's
          package-manager-cache: false # pnpm/action-setup caches the store

      - run: pnpm install --frozen-lockfile

      # A merged migration has already run on the live database, and is recorded there by file name, so an edit
      # to it would never be applied. A change to the schema is a new migration.
      - name: Merged migrations are not edited
        if: github.event_name == 'pull_request'
        run: |
          # --diff-filter=a lists every change except an added file. No pipe, so a git error fails the step.
          edited=$(git diff --name-status --diff-filter=a "origin/$GITHUB_BASE_REF...HEAD" -- migrations/)
          if [ -n "$edited" ]; then
            echo "::error::A migration that has merged was edited, renamed or removed. Add a new migration instead."
            echo "$edited"
            exit 1
          fi

      - run: pnpm lint

      - run: pnpm typecheck

      # Every migration applies to an empty database, then the tests that need a real Postgres run against it.
      # A plain `pnpm test` skips those; ALLOW_DB_TESTS=1 is what lets them run.
      - run: pnpm migrate

      - run: pnpm test
        env:
          ALLOW_DB_TESTS: "1"

      # The local seed (scripts/seed.ts) still fits the schema and still makes every state each scenario promises,
      # which it checks through the site's own code once it has seeded. In a second database, so the tests' is left alone,
      # marked as `pnpm db:start` marks its own (scripts/local-db.mjs, MARK), with pretend values like the ones it writes.
      - name: Seed each local scenario into a second database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seeded
          BETTER_AUTH_URL: http://localhost:3100
          LICHESS_TEAM_ID: pretend-team
          ORGANISER_USER_ID: org
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -base64 32)" LICHESS_TOKEN_KEY="$(openssl rand -base64 32)"
          psql postgres://postgres:postgres@localhost:5432/postgres -c "create database seeded" \
            -c "comment on database seeded is 'offboard: a throwaway local database made by pnpm db:start'"
          pnpm migrate
          for scenario in club season-over empty scheduled; do pnpm seed "$scenario"; done
