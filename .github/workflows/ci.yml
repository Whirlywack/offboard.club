name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # The same major version as the live database, so the real-Postgres tests mean something.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the migrations check compares against the base branch

      - uses: pnpm/action-setup@v6 # the pnpm version comes from package.json's packageManager
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 26 # the Vercel project's Node.js version
          package-manager-cache: false # pnpm/action-setup caches the store

      - run: pnpm install --frozen-lockfile

      # A merged migration has already run on the live database, and is recorded there by file name, so an edit
      # to it would never be applied. A change to the schema is a new migration.
      - name: Merged migrations are not edited
        if: github.event_name == 'pull_request'
        run: |
          # --diff-filter=a lists every change except an added file. No pipe, so a git error fails the step.
          edited=$(git diff --name-status --diff-filter=a "origin/$GITHUB_BASE_REF...HEAD" -- migrations/)
          if [ -n "$edited" ]; then
            echo "::error::A migration that has merged was edited, renamed or removed. Add a new migration instead."
            echo "$edited"
            exit 1
          fi

      - run: pnpm lint

      - run: pnpm typecheck

      # Every migration applies to an empty database, then the tests that need a real Postgres run against it.
      # A plain `pnpm test` skips those; ALLOW_DB_TESTS=1 is what lets them run.
      - run: pnpm migrate

      - run: pnpm test
        env:
          ALLOW_DB_TESTS: "1"
